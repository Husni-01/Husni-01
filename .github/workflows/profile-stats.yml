name: Generate Profile Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics Tool Execution
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Husni-01
          template: classic
          base: "" # Turns off the massive text block list layout
          plugin_lines: yes # Activates the visual lines graph script
          plugin_lines_sections: history # Focuses on your contribution timeline
          config_timezone: GMT
