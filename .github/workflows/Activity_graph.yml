name: Update Activity Graph
on:
  schedule:
    - cron: "0 0 * * *" # Runs every night
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Graph
        uses: platane/snk@v3
        with:
          github_user_name: Husni-01
          outputs: dist/activity-graph.svg
      - name: Push to Repo
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
